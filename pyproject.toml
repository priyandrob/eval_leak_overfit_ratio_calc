[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "priyandrob-eval_leak_overfit_ratio_calc"
version = "0.1.0"
description = "从输入中抽取数值，计算工具调用协议工程师·评测集泄漏与过拟合相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "priyandrob" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://priyandrob.github.io"
Repository = "https://github.com/priyandrob/eval_leak_overfit_ratio_calc"
Issues = "https://github.com/priyandrob/eval_leak_overfit_ratio_calc/issues"

[project.scripts]
eval_leak_overfit_ratio_calc = "eval_leak_overfit_ratio_calc:main"

[tool.setuptools]
py-modules = ["eval_leak_overfit_ratio_calc"]
